{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Reset password{% endblock %}
{% block auth %}
<form method="post" class="stack">
  {{ csrf() }}
  <div class="field"><label>New password</label><input type="password" name="new" minlength="8" required></div>
  <div class="field"><label>Confirm password</label><input type="password" name="confirm" minlength="8" required></div>
  <button class="btn btn-block">Set new password</button>
</form>
{% endblock %}
